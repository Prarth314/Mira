name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run evaluate
      - name: Start Windows audio backend for synthetic capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Service Audiosrv
      - run: npx playwright test
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ matrix.os }}
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.os }}
          path: test-results/evaluation.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.os }}
          path: |
            dist/
            dist-electron/
