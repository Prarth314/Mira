<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Mira — Your voice. Your tools. Your flow.</title>
  <desc id="desc">A violet waveform on a dark background, with the Mira wordmark and voice workspace tagline.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101124"/><stop offset="1" stop-color="#080b13"/></linearGradient>
    <linearGradient id="wave"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".24"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <ellipse cx="1040" cy="210" rx="360" ry="300" fill="url(#glow)"/>
  <rect x="56" y="50" width="174" height="28" rx="14" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".3"/>
  <text x="76" y="69" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">VOICE WORKSPACE</text>
  <text x="56" y="199" fill="#f4f4ff" font-family="Segoe UI,Arial,sans-serif" font-size="102" font-weight="700" letter-spacing="-5">mira<tspan fill="#a78bfa">.</tspan></text>
  <text x="61" y="255" fill="#ddd6fe" font-family="Segoe UI,Arial,sans-serif" font-size="29">Your voice. Your tools. Your flow.</text>
  <text x="61" y="305" fill="#929bb1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Local transcription · Deliberate delivery · Built for developers</text>
  <g stroke="url(#wave)" stroke-width="12" stroke-linecap="round">
    <path d="M810 194v32 M842 163v94 M874 125v170 M906 173v74 M938 94v232 M970 147v126 M1002 117v186 M1034 168v84 M1066 140v140 M1098 181v58 M1130 159v102 M1162 195v30"/>
  </g>
  <path d="M60 362h1160" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="61" y="389" fill="#69758c" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">OPEN SOURCE / DESKTOP / MIT</text>
</svg>
