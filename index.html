<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { font-family: 'Inter', sans-serif; }
    @supports (font-variation-settings: normal) {
      :root { font-family: 'Inter var', sans-serif; }
    }
    body {
      background-color: #020617;
      background-image:
        radial-gradient(circle at 50% -20%, #0c4a6e 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, #082f49 0%, transparent 40%);
      color: #f8fafc;
      margin: 0;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Source Code Pro', monospace;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(34, 211, 238, 0.2);
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
    }
    .draggable { -webkit-app-region: drag; }
    .non-draggable { -webkit-app-region: no-drag; }
    button:focus-visible {
      outline: 2px solid #22d3ee;
      outline-offset: 4px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.2); border-radius: 10px; }

    @keyframes slow-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }
    .animate-slow-pulse {
      animation: slow-pulse 8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
